%HEADER%

<main class="container py-3">
  <div id="extraInfo" class="mt-3" style="font-family: sans-serif;">
    <div><strong>Control Method:</strong> <span id="controlMethod">--</span></div>
    <div><strong>Profile:</strong> <span id="profileName">--</span></div>
    <div><strong>Phase:</strong> <span id="phaseName">--</span></div>
  </div>
  <div id="telemetryChart" style="width:100%; height:300px;"></div>
  <div id="telemetryLegend" class="mt-2"></div>
</main>

<script>
function initTelemetryChart() {
  const data = [
    [], // time
    [], // inputPressure
    [], // setPressure
    [], // pumpFlowRate
    [], // setPumpFlowRate
    [], // currBrewWeight
    [], // dimmerPower
  ];

  const uplotOptions = {
    title: "Brew Telemetry",
    width: document.getElementById("telemetryChart").clientWidth,
    height: 300,
    series: [
      { 
        label: "Time (s)" 
      },
      { 
        label: "Input Pressure", stroke: "red" 
      },
      { 
        label: "Set Pressure", stroke: "darkred", dash: [5, 5] 
      },
      { 
        label: "Pump Flow", stroke: "green" 
      },
      { 
        label: "Set Pump Flow", stroke: "darkgreen", dash: [5, 5] 
      },
      { 
        label: "Weight Brewed", stroke: "blue", scale: "right" 
      },
      { 
        label: "Pump Power %", stroke: "purple", scale: "right" 
      },
    ],
    axes: [
      { 
        label: "Time (s)" 
      },
      { 
        label: "Pressure/Flow", min: 0, max: 11 
      },
      { 
        label: "Weight/Power %", scale: "right", side: 1, min: 0, max: 100 
      },
    ],
    scales: {
      x: { 
        time: false 
      },
      y: { 
        auto: false 
      },
      right: { 
        auto: false 
      },
    },
  };

  const chart = new uPlot(uplotOptions, data, document.getElementById("telemetryChart"));

  const legendContainer = document.getElementById("telemetryLegend");
  legendContainer.innerHTML = "";


  for (let i = 1; i < uplotOptions.series.length; i++) {
    const s = uplotOptions.series[i];

    const item = document.createElement("div");
    item.style.display = "inline-block";
    item.style.marginRight = "15px";

    const swatch = document.createElement("span");
    swatch.style.display = "inline-block";
    swatch.style.width = "12px";
    swatch.style.height = "12px";
    swatch.style.marginRight = "6px";
    swatch.style.verticalAlign = "middle";
    swatch.style.backgroundColor = s.stroke;
    swatch.style.border = "1px solid #aaa";

    if (s.dash) {
      swatch.style.backgroundImage = `repeating-linear-gradient(
        90deg,
        ${s.stroke},
        ${s.stroke} 3px,
        white 3px,
        white 6px
      )`;
      swatch.style.backgroundSize = "6px 100%";
    }

    const label = document.createElement("span");
    label.textContent = s.label + ": ";

    const value = document.createElement("span");
    value.id = `live-value-${i}`;
    value.textContent = "--";

    item.appendChild(swatch);
    item.appendChild(label);
    item.appendChild(value);
    legendContainer.appendChild(item);
  }

  return { chart, data };
}

let chartObj = null;
let startTime = null;
let isBrewing = false;

document.addEventListener("DOMContentLoaded", () => {
  chartObj = initTelemetryChart();
  const { chart, data } = chartObj;

  const eventSource = new EventSource("/events");

  eventSource.addEventListener("brew_state", (event) => {
    const state = event.data;

    if (state === "start") {
      isBrewing = true;

      for (let i = 0; i < data.length; i++) {
        data[i].length = 0;
      }
      chart.setData(data);
    } 
    else if (state === "stop") {
      isBrewing = false;
    }

    const latestIndex = chart.data[0].length - 1;
    for (let i = 1; i < chart.data.length; i++) {
      const value = chart.data[i][latestIndex];
      const el = document.getElementById(`live-value-${i}`);

      if (el) 
      {
        el.textContent = value?.toFixed(2) ?? "--";
      }
    }
  });

  eventSource.addEventListener("brew_event", (event) => {
    if (!isBrewing) return;

    try {

      const json = JSON.parse(event.data);

      data[0].push(json.currBrewTime ?? 0);
      data[1].push(json.inputPressure ?? null);
      data[2].push(json.setPressure ?? null);
      data[3].push(json.pumpFlowRate ?? null);
      data[4].push(json.setPumpFlowRate ?? null);
      data[5].push(json.currBrewWeight ?? null);
      data[6].push(json.dimmerPower ?? null);

      // Keep only last 1000 points
      if (data[0].length > 1000) {
        for (let i = 0; i < data.length; i++) data[i].shift();
      }

      if (json.control) {
        document.getElementById("controlMethod").textContent = json.control;
      }

      if (json.profile) {
        document.getElementById("profileName").textContent = json.profile;
      }

      if (json.phase) {
        document.getElementById("phaseName").textContent = json.phase;
      }

      chart.setData(data);
    } catch (err) {
      console.warn("Bad JSON:", event.data);
    }



  });
});

</script>

</div>

</body>
</html>
